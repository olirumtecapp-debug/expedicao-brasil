        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }

    <!-- Script Principal como Módulo para suportar Nuvem (Firebase) -->

        try {
            const savedLocal = localStorage.getItem('expedicao_firebase_config');

            rawConfig = window.FIREBASE_CONFIG;
        } else if (!rawConfig && typeof __firebase_config !== 'undefined') {
            rawConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;

        const isConfigured = rawConfig && rawConfig.apiKey && !rawConfig.apiKey.includes('SUA_API_KEY') && !rawConfig.apiKey.includes('...');

            try {

                auth = getAuth(app);
                db = getFirestore(app);
            } catch (err) {
                console.warn("Erro ao inicializar Firebase:", err);
            }
        }

                            imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Lavagem_de_min%C3%A9rio_de_ouro_perto_da_montanha_Ita_Columi.jpg/800px-Lavagem_de_min%C3%A9rio_de_ouro_perto_da_montanha_Ita_Columi.jpg',

            questions: [
                { category: 'colonia', text: 'Qual foi a árvore que deu nome ao nosso país?', options: ['Seringueira', 'Pau-Brasil', 'Ipê', 'Cacau'], correct: 1, explanation: 'O Pau-Brasil soltava uma tinta vermelha valiosa.' },
                { category: 'colonia', text: 'O que era o "Ouro Branco"?', options: ['Sal', 'Algodão', 'Açúcar', 'Leite'], correct: 2, explanation: 'O açúcar era um artigo de luxo na Europa.' },

                { category: 'imperio', text: 'Qual lei libertou os escravizados?', options: ['Lei do Ouro', 'Lei Áurea', 'Lei Livre', 'Lei de Portugal'], correct: 1, explanation: 'Assinada pela Princesa Isabel em 1888.' },

        let appData = {};
        let currentState = 'MENU';
        let currentUser = null;
        let selectedCategoryId = null;
        let currentChapterIndex = 0;
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let quizAnswers = [];
        let studentsProgress = {};
        
        let adminSelectedCategoryForEdit = null;
        let adminStudentFilter = 'Todos';
        let adminModuleFilter = 'Todos';

        const mainContent = document.getElementById('main-content');
        const modalContainer = document.getElementById('modal-container');
        const modalContent = document.getElementById('modal-content');
        const userInfoDisplay = document.getElementById('user-info');
        const currentUserNameDisplay = document.getElementById('current-user-name');

        window.showModal = function(html) {
            modalContent.innerHTML = html;
            modalContainer.classList.remove('hidden');
        }

        window.hideModal = function() {
            modalContainer.classList.add('hidden');
        }

        window.customAlert = function(message) {
            window.showModal(`
                <div class="text-center">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">Aviso</h3>
                    <p class="text-gray-600 mb-6">${message}</p>
                    <button onclick="window.hideModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold w-full">OK, Entendi</button>
                </div>
            `);
        }

        window.customConfirm = function(message, onConfirmCallbackStr) {
            window.showModal(`
                <div class="text-center">
                    <div class="text-5xl mb-4">⚠️</div>
                    <h3 class="text-xl font-bold text-gray-800 mb-2">Tem certeza?</h3>
                    <p class="text-gray-600 mb-6 text-sm">${message}</p>
                    <div class="flex gap-2 justify-center">
                        <button onclick="window.hideModal()" class="w-1/2 px-4 py-2 text-gray-500 font-bold hover:bg-gray-100 rounded-lg border border-gray-200">Cancelar</button>
                        <button onclick="window.hideModal(); ${onConfirmCallbackStr}" class="w-1/2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold shadow-md">Sim, Continuar</button>
                    </div>
                </div>
            `);
        }

        function calculateGrade(score, total) {
            const percentage = total > 0 ? (score / total) * 100 : 0;
            if (percentage >= 90) return { grade: 'A', text: 'Excelente!', color: 'text-green-600' };
            if (percentage >= 70) return { grade: 'B', text: 'Muito Bom', color: 'text-blue-600' };
            if (percentage >= 50) return { grade: 'C', text: 'Regular', color: 'text-amber-600' };
            return { grade: 'D', text: 'Precisa Revisar', color: 'text-red-600' };
        }

        function loadLocalData() {
            try {
                const savedCourse = localStorage.getItem('expedicao_course_data');
                if (savedCourse) appData = JSON.parse(savedCourse);
                else appData = JSON.parse(JSON.stringify(initialCourseData));

                const savedProgress = localStorage.getItem('expedicao_students_progress');
                if (savedProgress) studentsProgress = JSON.parse(savedProgress);
            } catch (e) {
                console.warn("Erro ao ler localStorage:", e);
                appData = JSON.parse(JSON.stringify(initialCourseData));
            }
        }

        function saveLocalData() {
            try {
                localStorage.setItem('expedicao_course_data', JSON.stringify(appData));
                localStorage.setItem('expedicao_students_progress', JSON.stringify(studentsProgress));
            } catch (e) {
                console.warn("Erro ao salvar localStorage:", e);
            }
        }

        async function loadCloudData() {
            loadLocalData();
            if (!auth || !auth.currentUser) return;
            
            try {
                // Carrega o conteúdo do curso da Nuvem
                const contentRef = doc(db, 'artifacts', appId, 'public', 'data', 'course_content', 'main');
                const docSnap = await getDoc(contentRef);
                
                if (docSnap.exists()) {
                    appData = docSnap.data();
                    saveLocalData();
                } else {
                    await setDoc(contentRef, appData);
                }

                // Carrega o progresso de todos os alunos
                await fetchCloudProgress();

            } catch (e) {
                console.error("Erro na nuvem:", e);
            }
        }

        async function fetchCloudProgress() {
            if (!auth || !auth.currentUser) return;
            try {
                const progressColl = collection(db, 'artifacts', appId, 'public', 'data', 'progress');
                const snapshot = await getDocs(progressColl);
                studentsProgress = {};
                snapshot.forEach(document => {
                    studentsProgress[document.id] = document.data().progress || {};
                });
                saveLocalData();
            } catch(e) {
                console.error("Erro ao puxar progresso", e);
            }
        }

        window.saveCourseDataCloud = async function() {
            saveLocalData();
            if (!auth || !auth.currentUser) {
                window.customAlert("💾 Conteúdo salvo localmente com sucesso! (Para sincronizar com todos os dispositivos, conecte as chaves do Firebase).");
                return;
            }
            const contentRef = doc(db, 'artifacts', appId, 'public', 'data', 'course_content', 'main');
            try {
                await setDoc(contentRef, appData);
                window.customAlert("✅ Curso atualizado na nuvem com sucesso! Todos os alunos já podem ver a nova versão.");
            } catch (e) {
                window.customAlert("Erro ao salvar na nuvem: " + e.message + " (salvo localmente)");
            }
        }

        async function updateStudentProgress(studentName, categoryId, chaptersRead, totalChapters, quizScore = null) {
            if (!studentsProgress[studentName]) studentsProgress[studentName] = {};
            if (!studentsProgress[studentName][categoryId]) studentsProgress[studentName][categoryId] = { chaptersRead: 0, quizScore: null };
            
            if (chaptersRead > studentsProgress[studentName][categoryId].chaptersRead) {
                 studentsProgress[studentName][categoryId].chaptersRead = chaptersRead;
            }
            if (quizScore !== null) {
                studentsProgress[studentName][categoryId].quizScore = quizScore;
            }
            studentsProgress[studentName][categoryId].totalChapters = totalChapters;
            studentsProgress[studentName][categoryId].lastAccess = new Date().toISOString();

            saveLocalData();

            // Salva na Nuvem silenciosamente se conectado
            if (!auth || !auth.currentUser) return;
            const studentRef = doc(db, 'artifacts', appId, 'public', 'data', 'progress', studentName);
            try {
                await setDoc(studentRef, { progress: studentsProgress[studentName] }, { merge: true });
            } catch (e) {
                console.error("Erro no envio EAD:", e);
            }
        }

        window.resetProgressCloud = async function() {
            studentsProgress = {};
            currentUser = null;
            userInfoDisplay.classList.add('hidden');
            saveLocalData();
            
            if (auth && auth.currentUser) {
                try {
                    const progressColl = collection(db, 'artifacts', appId, 'public', 'data', 'progress');
                    const snapshot = await getDocs(progressColl);
                    for (const document of snapshot.docs) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'progress', document.id));
                    }
                    window.customAlert("Todos os históricos de alunos foram apagados da nuvem e do armazenamento local.");
                    window.renderAdminDashboard();
                } catch(e) {
                    window.customAlert("Erro ao limpar nuvem.");
                }
            } else {
                window.customAlert("Histórico local de alunos zerado.");
                window.renderAdminDashboard();
            }
        }

        window.openFirebaseConfigModal = function() {
            const currentCfgStr = rawConfig ? JSON.stringify(rawConfig, null, 2) : '';
            window.showModal(`
                <div class="text-left">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-2xl">🔥</span>
                        <h3 class="text-xl font-bold text-gray-800">Conectar Firebase (Nuvem)</h3>
                    </div>
                    <p class="text-xs text-gray-500 mb-3 leading-relaxed">Cole abaixo o objeto <code>firebaseConfig</code> do console do Firebase (ou edite o arquivo <code>firebase-config.js</code>):</p>
                    <textarea id="firebase-json-input" class="w-full h-44 p-3 border-2 border-indigo-100 rounded-xl font-mono text-xs focus:border-indigo-500 focus:outline-none bg-slate-900 text-emerald-400 mb-4" placeholder='{\n  "apiKey": "AIzaSy...",\n  "authDomain": "seu-app.firebaseapp.com",\n  "projectId": "seu-app",\n  "storageBucket": "seu-app.appspot.com",\n  "messagingSenderId": "...",\n  "appId": "..."\n}'>${currentCfgStr}</textarea>
                    <div class="flex gap-2 justify-end">
                        <button onclick="window.hideModal()" class="px-4 py-2 text-gray-500 font-bold hover:bg-gray-100 rounded-lg">Cancelar</button>
                        <button onclick="window.saveFirebaseConfigFromModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-bold shadow-md">Salvar e Conectar</button>
                    </div>
                </div>
            `);
        }

        window.saveFirebaseConfigFromModal = function() {
            const txt = document.getElementById('firebase-json-input').value.trim();
            try {
                let parsed = null;
                if (txt.startsWith('{')) {
                    parsed = JSON.parse(txt);
                } else {
                    // Tenta extrair formato JS
                    const match = txt.match(/\{[\s\S]*\}/);
                    if (match) parsed = (new Function('return ' + match[0]))();
                }
                if (parsed && parsed.apiKey) {
                    localStorage.setItem('expedicao_firebase_config', JSON.stringify(parsed));
                    window.hideModal();
                    window.customAlert("✅ Configuração do Firebase salva! A página será recarregada para conectar.");
                    setTimeout(() => location.reload(), 1200);
                } else {
                    window.customAlert("JSON inválido ou campo 'apiKey' ausente.");
                }
            } catch (err) {
                window.customAlert("Erro ao analisar JSON: " + err.message);
            }
        }

        function getStudentProgress(studentName, categoryId) {
            return studentsProgress[studentName]?.[categoryId] || { chaptersRead: 0, quizScore: null };
        }

        async function initAppEAD() {
            loadLocalData();
            if (!app) {
                console.warn("Sem credenciais do Firebase. Rodando em modo local offline.");
                window.changeState('MENU');
                return;
            }

            try {
                if (authToken) {
                    await signInWithCustomToken(auth, authToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (auth.currentUser) {
                    await loadCloudData();
                }
            } catch (e) {
                console.error("Falha de autenticação EAD:", e);
            }
            
            window.changeState('MENU');
        }

                    <h2 class="text-3xl md:text-5xl font-black text-gray-800 mb-4 tracking-tight">Expedição Brasil</h2>
                    <p class="text-gray-500 mb-8 text-lg font-medium">Um curso interativo e divertido sobre a nossa história!</p>
                    <div class="w-full flex flex-col gap-3">

                window.showModal(`

            mainContent.innerHTML = `

        window.answerQuestion = function(selectedIndex) {
            const q = quizQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.correct;
            
            quizAnswers.push({ question: q, selected: selectedIndex, isCorrect: isCorrect });

            const optionsHTML = q.options.map((opt, i) => {
                let btnClass = "w-full text-left p-4 rounded-xl border-2 font-semibold text-lg flex items-center justify-between ";
                if (i === q.correct) {
                    btnClass += "bg-green-100 border-green-500 text-green-800";
                } else if (i === selectedIndex && !isCorrect) {
                    btnClass += "bg-red-100 border-red-500 text-red-800";
                } else {
                    btnClass += "bg-gray-50 border-gray-200 text-gray-400 opacity-50";
                }
                
                let icon = "";
                if (i === q.correct) icon = "✅";
                if (i === selectedIndex && !isCorrect) icon = "❌";

                return `
                    <div class="${btnClass}">
                        <div><span class="font-bold mr-2">${String.fromCharCode(65 + i)})</span> ${opt}</div>
                        <div class="text-2xl">${icon}</div>
                    </div>
                `;
            }).join('');

            const category = appData.categories.find(c => c.id === selectedCategoryId);

            mainContent.innerHTML = `

                        <p class="text-blue-900">${q.explanation}</p>

        }

                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wide">Filtrar por Módulo</label>
                                    <select onchange="window.updateFilter('module', this.value)" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-gray-50 font-bold text-gray-700 cursor-pointer focus:border-indigo-500 focus:outline-none">
                                        ${moduleOptions}
                                    </select>
                                </div>
                            </div>

                            <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-100 text-gray-500 text-xs uppercase tracking-wider">
                                            <th class="py-3 px-4 font-black">Aluno</th>
                                            <th class="py-3 px-4 font-black">Módulo Estudado</th>
                                            <th class="py-3 px-4 font-black">Progresso do Curso</th>
                                            <th class="py-3 px-4 font-black">Nota do Quiz</th>
                                            <th class="py-3 px-4 font-black">Data Acesso</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${rowsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.changeEditCategory = function(catId) { adminSelectedCategoryForEdit = catId; window.renderAdminEditor(); }
        window.updateCategoryData = function(field, value) { const cat = appData.categories.find(c => c.id === adminSelectedCategoryForEdit); if (cat) cat[field] = value; if (field === 'name') window.renderAdminEditor(); }
        window.updateChapter = function(catId, index, field, value) { const cat = appData.categories.find(c => c.id === catId); cat.chapters[index][field] = value; }
        window.updateQuestion = function(globalIndex, field, value, optIndex = -1) { if (field === 'options') appData.questions[globalIndex].options[optIndex] = value; else if (field === 'correct') appData.questions[globalIndex].correct = parseInt(value); else appData.questions[globalIndex][field] = value; }
        
        window.addCategory = function() {
            const newId = 'modulo_' + Date.now();
            appData.categories.push({ id: newId, name: 'Novo Módulo EAD', icon: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253', description: 'Descrição do módulo...', chapters: [] });
            adminSelectedCategoryForEdit = newId;
            window.renderAdminEditor();
        }

        window.removeCategory = function() {
            const index = appData.categories.findIndex(c => c.id === adminSelectedCategoryForEdit);
            if (index > -1) {
                appData.categories.splice(index, 1);
                appData.questions = appData.questions.filter(q => q.category !== adminSelectedCategoryForEdit);
                adminSelectedCategoryForEdit = appData.categories.length > 0 ? appData.categories[0].id : null;
                window.renderAdminEditor();
            }
        }

        window.addChapter = function(catId) { const cat = appData.categories.find(c => c.id === catId); cat.chapters.push({ title: 'Novo Capítulo', content: 'Escreva a aula aqui...', imageUrl: '' }); window.renderAdminEditor(); }
        window.removeChapter = function(catId, index) { const cat = appData.categories.find(c => c.id === catId); cat.chapters.splice(index, 1); window.renderAdminEditor(); }
        window.addQuestion = function(catId) { appData.questions.push({ category: catId, text: 'Nova pergunta?', options: ['Opção A', 'Opção B', 'Opção C', 'Opção D'], correct: 0, explanation: 'Explicação.' }); window.renderAdminEditor(); }
        window.removeQuestion = function(globalIndex) { appData.questions.splice(globalIndex, 1); window.renderAdminEditor(); }

        window.restoreDefaultData = function() {
            appData = JSON.parse(JSON.stringify(initialCourseData));
            window.saveCourseDataCloud();
            window.renderAdminEditor();
        }

        window.renderAdminEditor = function() {
            if (!adminSelectedCategoryForEdit && appData.categories.length > 0) adminSelectedCategoryForEdit = appData.categories[0].id;
            const category = appData.categories.find(c => c.id === adminSelectedCategoryForEdit);
            
            const tabsHTML = appData.categories.map(c => `
                <button onclick="window.changeEditCategory('${c.id}')" class="whitespace-nowrap px-4 py-3 font-bold rounded-t-xl border-b-4 ${adminSelectedCategoryForEdit === c.id ? 'border-indigo-600 text-indigo-700 bg-indigo-50' : 'border-transparent text-gray-500 hover:bg-gray-100 transition-colors'}">
                    ${c.name}
                </button>
            `).join('') + `
                <button onclick="window.addCategory()" class="whitespace-nowrap px-4 py-3 font-bold rounded-t-xl border-b-4 border-transparent text-green-600 hover:bg-green-50 transition-colors flex items-center gap-1">
                    <span class="text-lg">+</span> Módulo EAD
                </button>
            `;

            let editorContentHTML = '';
            if (category) {
                editorContentHTML = `
                    <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 mb-8 relative shadow-sm">
                        <button onclick="window.customConfirm('Você irá apagar ESTE MÓDULO e suas perguntas!', 'window.removeCategory()')" class="absolute top-6 right-6 text-red-600 hover:bg-red-100 px-4 py-2 rounded-lg text-sm font-bold border border-transparent hover:border-red-200">
                            🗑️ Apagar Módulo
                        </button>
                        <h3 class="text-lg font-black text-indigo-900 mb-4">⚙️ Configuração Geral</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-indigo-500 uppercase mb-2">Nome</label>
                                <input type="text" value="${category.name}" onchange="window.updateCategoryData('name', this.value)" class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:border-indigo-600 focus:outline-none font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-indigo-500 uppercase mb-2">Descrição Curta</label>
                                <input type="text" value="${category.description}" onchange="window.updateCategoryData('description', this.value)" class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:border-indigo-600 focus:outline-none text-gray-600">
                            </div>
                        </div>
                    </div>

                    <!-- Capítulos -->
                    <div class="mb-10">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-black text-indigo-900">📖 Aulas do Módulo</h3>
                            <button onclick="window.addChapter('${category.id}')" class="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 px-4 py-2 rounded-lg font-bold text-sm">+ Nova Aula</button>
                        </div>
                        <div class="bg-gray-100 p-4 md:p-6 rounded-2xl border border-gray-200">
                            ${category.chapters.length === 0 ? '<p class="text-gray-500 text-center">Nenhuma aula. Adicione uma.</p>' : category.chapters.map((chap, i) => `
                                <div class="bg-white p-5 rounded-xl border border-gray-200 mb-4 shadow-sm relative">
                                    <button onclick="window.customConfirm('Excluir aula ${i+1}?', 'window.removeChapter(\\'${category.id}\\', ${i})')" class="absolute top-4 right-4 text-red-500 hover:bg-red-50 p-2 rounded-lg">🗑️</button>
                                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Título</label>
                                    <input type="text" value="${chap.title}" onchange="window.updateChapter('${category.id}', ${i}, 'title', this.value)" class="w-full md:w-3/4 px-3 py-2 border rounded-lg focus:border-indigo-500 font-bold mb-4">
                                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Link Imagem EAD</label>
                                    <input type="text" value="${chap.imageUrl}" onchange="window.updateChapter('${category.id}', ${i}, 'imageUrl', this.value)" class="w-full px-3 py-2 border rounded-lg focus:border-indigo-500 text-sm mb-4">
                                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Conteúdo da Aula</label>
                                    <textarea onchange="window.updateChapter('${category.id}', ${i}, 'content', this.value)" class="w-full px-3 py-2 border rounded-lg focus:border-indigo-500" rows="3">${chap.content}</textarea>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Perguntas -->
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-black text-teal-900">🎮 Quiz do Módulo</h3>
                            <button onclick="window.addQuestion('${category.id}')" class="bg-teal-100 text-teal-700 hover:bg-teal-200 px-4 py-2 rounded-lg font-bold text-sm">+ Pergunta</button>
                        </div>
                        <div class="bg-gray-100 p-4 md:p-6 rounded-2xl border border-gray-200">
                            ${appData.questions.filter(q => q.category === category.id).length === 0 ? '<p class="text-gray-500 text-center">Nenhuma pergunta para este módulo.</p>' : appData.questions.map((q, globalIndex) => {
                                if (q.category !== category.id) return '';
                                return `
                                    <div class="bg-white p-5 rounded-xl border border-gray-200 mb-4 shadow-sm relative">
                                        <button onclick="window.customConfirm('Excluir pergunta?', 'window.removeQuestion(${globalIndex})')" class="absolute top-4 right-4 text-red-500 hover:bg-red-50 p-2 rounded-lg">🗑️</button>
                                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Pergunta</label>
                                        <input type="text" value="${q.text}" onchange="window.updateQuestion(${globalIndex}, 'text', this.value)" class="w-full px-3 py-2 border rounded-lg font-bold mb-4">
                                        <div class="grid md:grid-cols-2 gap-6">
                                            <div>
                                                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Alternativas</label>
                                                ${q.options.map((opt, optIndex) => `
                                                    <div class="flex items-center gap-2 mb-2">
                                                        <span class="font-bold text-gray-400 w-6">${String.fromCharCode(65 + optIndex)})</span>
                                                        <input type="text" value="${opt}" onchange="window.updateQuestion(${globalIndex}, 'options', this.value, ${optIndex})" class="flex-grow px-3 py-1 border rounded-lg text-sm">
                                                    </div>
                                                `).join('')}
                                            </div>
                                            <div>
                                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Alternativa Correta</label>
                                                <select onchange="window.updateQuestion(${globalIndex}, 'correct', this.value)" class="w-full px-3 py-2 border rounded-lg bg-green-50 text-green-800 font-bold mb-4">
                                                    ${q.options.map((_, i) => `<option value="${i}" ${q.correct === i ? 'selected' : ''}>Opção ${String.fromCharCode(65 + i)}</option>`).join('')}
                                                </select>
                                                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Explicação ao errar</label>
                                                <textarea onchange="window.updateQuestion(${globalIndex}, 'explanation', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm" rows="2">${q.explanation}</textarea>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                editorContentHTML = `<div class="flex flex-col items-center justify-center h-64 text-gray-400"><span class="text-5xl mb-4">📭</span><p>Nenhum módulo. Crie um novo acima.</p></div>`;
            }

            mainContent.innerHTML = `
                <div class="fade-in w-full max-w-6xl flex h-[80vh] bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
                    <div class="w-64 bg-gray-900 text-gray-300 flex flex-col shrink-0">
                        <div class="p-6 text-center border-b border-gray-800">
                            <div class="text-4xl mb-2">👨‍🏫</div>
                            <h2 class="font-black text-white tracking-wide">EAD Admin</h2>
                        </div>
                        <nav class="flex-grow p-4 space-y-2">
                            <button onclick="window.changeState('ADMIN_DASHBOARD')" class="w-full text-left px-4 py-3 hover:bg-gray-800 hover:text-white rounded-xl transition flex items-center gap-2 text-gray-300">
                                📊 Relatórios Nuvem
                            </button>
                            <button onclick="window.changeState('ADMIN_EDITOR')" class="w-full text-left px-4 py-3 bg-gray-800 text-white rounded-xl font-bold flex items-center gap-2">
                                📝 Editar Curso/Quiz
                            </button>
                            <button onclick="window.openFirebaseConfigModal()" class="w-full text-left px-4 py-3 hover:bg-gray-800 hover:text-amber-400 rounded-xl transition flex items-center gap-2 text-gray-300 font-bold">
                                🔥 Configurar Firebase
                            </button>
                        </nav>
                        <div class="p-4 border-t border-gray-800">
                            <button onclick="window.changeState('MENU')" class="w-full text-left px-4 py-3 hover:bg-gray-800 hover:text-white rounded-xl transition flex items-center gap-2">
                                🚪 Sair do Painel
                            </button>
                        </div>
                    </div>

                    <div class="flex-grow bg-gray-50 flex flex-col relative overflow-hidden">
                        <div class="p-6 border-b border-gray-200 bg-white flex justify-between items-center shrink-0 shadow-sm">
                            <div>
                                <h2 class="text-3xl font-black text-gray-800">Editor de Conteúdo da Nuvem</h2>
                                <p class="text-gray-500 text-sm">Atualizações serão enviadas direto para o banco de dados dos alunos.</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.customConfirm('Isso apagará suas edições na NUVEM e voltará ao padrão!', 'window.restoreDefaultData()')" class="px-4 py-2 text-red-500 hover:bg-red-50 border border-red-200 rounded-lg font-bold text-sm transition bg-white">
                                    Restaurar Padrões
                                </button>
                                <button onclick="window.saveCourseDataCloud()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-bold flex items-center gap-2 transition shadow-md hover:-translate-y-0.5 border border-indigo-700">
                                    ☁️ Enviar para Nuvem
                                </button>
                            </div>
                        </div>
                        
                        <div class="flex-grow overflow-auto p-4 md:p-8">
                            <div class="flex border-b border-gray-200 mb-8 overflow-x-auto gap-1 pb-1 custom-scrollbar">
                                ${tabsHTML}
                            </div>
                            ${editorContentHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        window.changeState = function(newState) {
            currentState = newState;
            switch(currentState) {
                case 'MENU': renderMenu(); break;
                case 'CATEGORY_SELECT': renderCategorySelect(); break;
                case 'MODULE_VIEW': renderModuleView(); break;
                case 'QUIZ': renderQuiz(); break;
                case 'ADMIN_LOGIN': renderAdminLogin(); break;
                case 'ADMIN_DASHBOARD': renderAdminDashboard(); break;
                case 'ADMIN_EDITOR': renderAdminEditor(); break;
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.altKey && event.shiftKey && event.key.toLowerCase() === 'm') {
                const adminBtn = document.getElementById('admin-login-btn');
                if (adminBtn) {
                    adminBtn.classList.toggle('hidden');
                    mainContent.classList.remove('fade-in');
                    void mainContent.offsetWidth;
                    mainContent.classList.add('fade-in');
                }
            }
        });

        // Inicia Conexão e Autenticação Firebase
        initAppEAD();
    </script>
</body>
</html>
