        // ==========================================
        // 1. ÁUDIO & SÍNTESE DE VOZ (Web Audio / TTS)
        // ==========================================
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        window.soundClick = function() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (_) {}
        };

        window.soundCorrect = function() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.08 + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.08);
                    osc.stop(ctx.currentTime + idx * 0.08 + 0.25);
                });
            } catch (_) {}
        };

        window.soundWrong = function() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch (_) {}
        };

        window.soundFanfare = function() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const fanfare = [
                    { f: 523.25, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 783.99, d: 0.15 },
                    { f: 1046.50, d: 0.4 }, { f: 783.99, d: 0.15 }, { f: 1046.50, d: 0.6 }
                ];
                let cur = ctx.currentTime;
                fanfare.forEach(item => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(item.f, cur);
                    gain.gain.setValueAtTime(0.25, cur);
                    gain.gain.exponentialRampToValueAtTime(0.01, cur + item.d);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(cur);
                    osc.stop(cur + item.d);
                    cur += item.d + 0.05;
                });
            } catch (_) {}
        };

        // TTS
        let isSpeaking = false;
        window.toggleReadAloud = function(text) {
            if (!('speechSynthesis' in window)) {
                window.customAlert('A leitura em voz alta não é suportada neste navegador.');
                return;
            }
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                updateAudioBtnUI(false);
                return;
            }
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/<[^>]*>?/gm, ' ');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.95;
            utterance.pitch = 1.05;

            utterance.onstart = () => { isSpeaking = true; updateAudioBtnUI(true); };
            utterance.onend = utterance.onerror = () => { isSpeaking = false; updateAudioBtnUI(false); };
            window.speechSynthesis.speak(utterance);
        };

        function updateAudioBtnUI(speaking) {
            const btn = document.getElementById('btn-tts-speaker');

                else window.coursesDatabase = JSON.parse(JSON.stringify(initialCoursesDatabase));

                const savedProgress = localStorage.getItem('expedicao_students_progress_v3');
                if (savedProgress) studentsProgress = JSON.parse(savedProgress);
            } catch (e) {
                console.warn("Erro ao ler localStorage:", e);
                window.coursesDatabase = JSON.parse(JSON.stringify(initialCoursesDatabase));
            }
            appData = window.coursesDatabase[currentSubjectId] || window.coursesDatabase.historia;
        }

        function saveLocalData() {
            try {
                localStorage.setItem('expedicao_courses_db_v3', JSON.stringify(window.coursesDatabase));
                localStorage.setItem('expedicao_students_progress_v3', JSON.stringify(studentsProgress));
            } catch (e) {
                console.warn("Erro ao salvar localStorage:", e);
            }
        }

        async function loadCloudData() {
            loadLocalData();
            if (!auth || !auth.currentUser) return;
            try {
                const contentRef = doc(db, 'artifacts', appId, 'public', 'data', 'courses_multi', 'main');
                const docSnap = await getDoc(contentRef);
                if (docSnap.exists()) {
                    window.coursesDatabase = docSnap.data();
                    appData = window.coursesDatabase[currentSubjectId] || window.coursesDatabase.historia;
                    saveLocalData();
                } else {
                    await setDoc(contentRef, window.coursesDatabase);
                }
                await fetchCloudProgress();
            } catch (e) {
                console.error("Erro ao carregar nuvem:", e);
            }
        }

        async function fetchCloudProgress() {
            if (!auth || !auth.currentUser) return;
            try {
                const progressColl = collection(db, 'artifacts', appId, 'public', 'data', 'progress_multi');
                const snapshot = await getDocs(progressColl);
                studentsProgress = {};
                snapshot.forEach(docItem => {
                    studentsProgress[docItem.id] = docItem.data().progress || {};
                });
                saveLocalData();
            } catch(e) {
                console.error("Erro ao puxar progresso", e);
            }
        }

        window.saveCourseDataCloud = async function() {
            window.coursesDatabase[currentSubjectId] = appData;
            saveLocalData();
            if (!auth || !auth.currentUser) {
                window.customAlert("💾 Conteúdo salvo localmente com sucesso!");
                return;
            }
            const contentRef = doc(db, 'artifacts', appId, 'public', 'data', 'courses_multi', 'main');
            try {
                await setDoc(contentRef, window.coursesDatabase);
                window.customAlert("✅ Cursos atualizados na nuvem com sucesso para todas as disciplinas!");
            } catch (e) {
                window.customAlert("Erro ao salvar na nuvem: " + e.message + " (salvo localmente)");
            }
        };

        async function updateStudentProgress(studentName, categoryId, chaptersRead, totalChapters, quizScore = null) {
            if (!studentsProgress[studentName]) studentsProgress[studentName] = { _meta: { turma: currentUserTurma, avatar: currentUserAvatar } };
            const subKey = currentSubjectId;
            if (!studentsProgress[studentName][subKey]) studentsProgress[studentName][subKey] = {};
            if (!studentsProgress[studentName][subKey][categoryId]) studentsProgress[studentName][subKey][categoryId] = { chaptersRead: 0, quizScore: null };
            
            if (chaptersRead > studentsProgress[studentName][subKey][categoryId].chaptersRead) {
                 studentsProgress[studentName][subKey][categoryId].chaptersRead = chaptersRead;
            }
            if (quizScore !== null) {
                studentsProgress[studentName][subKey][categoryId].quizScore = quizScore;
            }
            studentsProgress[studentName][subKey][categoryId].totalChapters = totalChapters;
            studentsProgress[studentName][subKey][categoryId].lastAccess = new Date().toISOString();
            studentsProgress[studentName]._meta = { turma: currentUserTurma, avatar: currentUserAvatar, lastUpdate: new Date().toISOString() };

            saveLocalData();

            if (!auth || !auth.currentUser) return;
            const studentRef = doc(db, 'artifacts', appId, 'public', 'data', 'progress_multi', studentName);
            try {
                await setDoc(studentRef, { progress: studentsProgress[studentName] }, { merge: true });
            } catch (e) {
                console.error("Erro de envio EAD:", e);
            }
        }

            studentsProgress = {};

                    const snapshot = await getDocs(progressColl);
                    for (const docItem of snapshot.docs) {

        window.exportReportCSV = function() {
            let csvRows = [
                ['Aluno', 'Avatar', 'Turma', 'Disciplina', 'Modulo', 'Progresso_Aulas', 'Nota_Quiz', 'Conceito', 'Data_Ultimo_Acesso']
            ];

            for (const [studentName, studentObj] of Object.entries(studentsProgress)) {
                const meta = studentObj._meta || {};
                const turma = meta.turma || 'Geral';
                const avatar = meta.avatar || '🧭';

                for (const [subjKey, catData] of Object.entries(studentObj)) {
                    if (subjKey === '_meta') continue;
                    const courseObj = window.coursesDatabase[subjKey];
                    if (!courseObj) continue;

                    for (const [catId, data] of Object.entries(catData)) {
                        const category = courseObj.categories.find(c => c.id === catId);
                        if (!category) continue;

                        const totalChaps = category.chapters.length;
                        const progressPercent = totalChaps > 0 ? Math.round((data.chaptersRead / totalChaps) * 100) : 0;
                        const totalQs = courseObj.questions.filter(q => q.category === catId).length;
                        
                        let notaStr = 'Pendente';
                        let conceitoStr = '-';
                        if (data.quizScore !== null) {
                            const grade = calculateGrade(data.quizScore, totalQs);
                            notaStr = `${data.quizScore}/${totalQs}`;
                            conceitoStr = `${grade.grade} - ${grade.text}`;
                        }
                        const dateStr = data.lastAccess ? new Date(data.lastAccess).toLocaleDateString('pt-BR') : '-';

                        csvRows.push([
                            `"${studentName}"`,
                            `"${avatar}"`,
                            `"${turma}"`,
                            `"${courseObj.name}"`,
                            `"${category.name}"`,
                            `"${progressPercent}%"`,
                            `"${notaStr}"`,
                            `"${conceitoStr}"`,
                            `"${dateStr}"`
                        ]);
                    }
                }
            }

            const csvString = '\uFEFF' + csvRows.map(e => e.join(';')).join('\n');
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', `boletim_geral_expedicao_brasil_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

                </div>
            `);
        };

        window.saveFirebaseConfigFromModal = function() {
            const txt = document.getElementById('firebase-json-input')?.value.trim();
            try {
                let parsed = null;
                if (txt.startsWith('{')) parsed = JSON.parse(txt);
                else {
                    const match = txt.match(/\{[\s\S]*\}/);
                    if (match) parsed = (new Function('return ' + match[0]))();
                }
                if (parsed && parsed.apiKey) {
                    localStorage.setItem('expedicao_firebase_config', JSON.stringify(parsed));
                    window.hideModal();
                    window.customAlert("✅ Configuração do Firebase salva com sucesso!");
                    setTimeout(() => location.reload(), 1000);
                } else {
                    window.customAlert("JSON inválido ou campo 'apiKey' ausente.");
                }
            } catch (err) {
                window.customAlert("Erro ao analisar JSON: " + err.message);

        };

                case 'CATEGORY_SELECT': renderCategorySelect(); break;
                case 'MODULE_VIEW': renderModuleView(); break;
                case 'QUIZ': renderQuiz(); break;
                case 'ADMIN_LOGIN': renderAdminLogin(); break;
                case 'ADMIN_DASHBOARD': renderAdminDashboard(); break;
                case 'ADMIN_EDITOR': renderAdminEditor(); break;
            }
        };

        // Atalho de Teclado: Alt + Shift + M
        document.addEventListener('keydown', function(event) {
            if (event.altKey && event.shiftKey && event.key.toLowerCase() === 'm') {
                const adminBtn = document.getElementById('admin-badge-btn');
                if (adminBtn) adminBtn.classList.toggle('hidden');
                window.changeState('ADMIN_LOGIN');
            }
        });

        // Inicialização
        async function initAppEAD() {
            loadLocalData();
            if (app && auth) {
                try {
                    if (authToken) await signInWithCustomToken(auth, authToken);
                    else await signInAnonymously(auth);
                    if (auth.currentUser) await loadCloudData();
                } catch (e) {
                    console.error("Falha de autenticação EAD:", e);
                }
            }
            window.changeState('PORTAL_HUB');
        }

        initAppEAD();
    </script>
</body>
</html>
